name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # The model files, by the revisions pinned in src/model.mjs: change the key with them.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/lexical-sophistication
          key: model-2fc06364-fafab72d
      - run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL: skip  # the CPU binaries ship in the package; this skips the CUDA download
      - run: npm test
      - run: npx lexical-sophistication "Describe a walk through a forest after the rain." --strength 3 --max-tokens 24

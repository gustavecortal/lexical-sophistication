name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # The model files are pinned to revisions in src/model.mjs.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/lexical-sophistication
          key: model-${{ hashFiles('src/model.mjs') }}
      - run: npm ci
      - run: npm test
      - run: npx lexical-sophistication "Describe a walk through a forest after the rain." --strength 3 --max-tokens 24
